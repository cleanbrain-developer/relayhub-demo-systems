name: Build, Push, Deploy

# CI/CD bridge for the single Hetzner K3s server, same interim-before-ArgoCD model as
# relayhub-java/english-core-speaking/cleanbrain-me-entrance. No dedicated test suite yet (see
# this repo's docs/status/current-state.md "Known constraints") — typecheck is the only gate.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: relayhub-demo-systems-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: cleanbrain-developer

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build-and-push:
    needs: typecheck
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/relayhub-demo-systems:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/relayhub-demo-systems:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # See cleanbrain-me-infra's README "relayhub-java" for how/when the cluster administrator
    # flips this repository variable on.
    if: github.ref == 'refs/heads/master' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure known SSH host key
        env:
          KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          GIT_SHA: ${{ github.sha }}
        run: |
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          PORT="${SSH_PORT:-22}"

          REMOTE_SCRIPT='set -euo pipefail
          SHA="$1"
          NS="cleanbrain-me-relayhub-java"
          # Shares this namespace with relayhub-java (a separate repo/CI pipeline), so
          # current-context cannot be relied on — see cleanbrain-me-infra README
          # "Multi-application kubeconfig on the deploy host".
          CTX="ci-deployer-relayhub-demo-systems@cleanbrain-me-k3s"
          export KUBECONFIG=/home/deploy/.kube/config
          kubectl --context="$CTX" -n "$NS" set image deployment/demo-systems demo-systems=ghcr.io/cleanbrain-developer/relayhub-demo-systems:"$SHA"
          kubectl --context="$CTX" -n "$NS" rollout status deployment/demo-systems --timeout=120s'

          ssh -i "$KEY_FILE" -p "$PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" bash -s -- "$GIT_SHA" <<< "$REMOTE_SCRIPT"

          rm -f "$KEY_FILE"
